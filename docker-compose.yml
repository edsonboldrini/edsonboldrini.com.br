services:
  edsonboldrini:
    build:
      context: .
      dockerfile: Dockerfile
    image: edsonboldrini-site:latest
    container_name: edsonboldrini-site
    restart: unless-stopped
    # Bound to loopback only: nginx on the host is the sole way in, and this
    # port is never exposed publicly. 3100 confirmed free (research/infra.md).
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
