# edsonboldrini.com.br — NEW server block. Additive only.
#
# Nothing in this file touches the CorteFilme block. Two constraints from
# research/infra.md drove how it is written:
#
#   1. The CorteFilme "sistema" block is already `listen 80 default_server`
#      and carries the catch-all `server_name _`. This file must therefore
#      NEVER use `default_server` — duplicating it fails `nginx -t`, and
#      worse, would steal the catch-all from CorteFilme.
#   2. Because unmatched :80 hosts are 301'd to sistema.cortefilme.com.br,
#      the ACME HTTP-01 challenge only works once this block exists with an
#      explicit server_name. Order: DNS -> this block -> nginx -t -> reload
#      -> certbot. Certbot rewrites this file to add the TLS directives.

server {
    listen 80;
    listen [::]:80;
    server_name edsonboldrini.com.br www.edsonboldrini.com.br;

    # Let certbot answer the challenge here rather than falling through to
    # the catch-all redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://edsonboldrini.com.br$request_uri;
    }
}

# Canonical host. www is redirected to the apex in its own block below so the
# canonical URL in <link rel=canonical>, the sitemap and the metadata all agree.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edsonboldrini.com.br;

    # ssl_certificate lines are inserted by certbot (its own lineage, NOT the
    # CorteFilme certificate).

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js fingerprints these, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.edsonboldrini.com.br;
    return 301 https://edsonboldrini.com.br$request_uri;
}
