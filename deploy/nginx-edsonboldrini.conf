# FINAL — installed after the certificate exists.
#
# The certificate is obtained with `certbot certonly --nginx`, which issues it
# WITHOUT rewriting this file. That is deliberate: certbot's installer would
# rewrite these blocks and drop the comments and the cache headers below.
#
# It is a separate lineage from CorteFilme's certificate. CorteFilme's cert
# covers four names in one file; re-issuing it to add this domain would put a
# live site at risk for no benefit.
#
# No `default_server` anywhere — the CorteFilme "sistema" block already owns
# it along with the catch-all `server_name _`.

# HTTP -> HTTPS. Keeps serving the ACME challenge so renewals work unattended.
server {
    listen 80;
    listen [::]:80;
    server_name edsonboldrini.com.br www.edsonboldrini.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://edsonboldrini.com.br$request_uri;
    }
}

# www -> apex. One canonical host, matching <link rel=canonical>, the sitemap
# and hreflang.
server {
    # No http2 here, deliberately. Protocol options on `listen` apply to the
    # SOCKET, not the server block, so enabling HTTP/2 on :443 would change
    # behaviour for every site sharing it — CorteFilme included. That is an
    # unrequested change to a production site, so it stays off. Enabling it is
    # a one-line, whole-machine decision for later, made on purpose.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.edsonboldrini.com.br;

    ssl_certificate     /etc/letsencrypt/live/edsonboldrini.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edsonboldrini.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://edsonboldrini.com.br$request_uri;
}

# The canonical host.
server {
    # No http2 here, deliberately. Protocol options on `listen` apply to the
    # SOCKET, not the server block, so enabling HTTP/2 on :443 would change
    # behaviour for every site sharing it — CorteFilme included. That is an
    # unrequested change to a production site, so it stays off. Enabling it is
    # a one-line, whole-machine decision for later, made on purpose.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name edsonboldrini.com.br;

    ssl_certificate     /etc/letsencrypt/live/edsonboldrini.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edsonboldrini.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next serves its static chunks uncompressed, and the global nginx.conf has
    # gzip_proxied commented out, so nothing compressed them. Scoped to THIS
    # server block on purpose: setting it globally would start compressing
    # CorteFilme's proxied responses too, which is not a change to make on
    # someone else's live site as a side effect.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # Applies to this host only — no includeSubDomains, no preload. There is no
    # HSTS anywhere else on this machine, and this must not leak onto
    # cortefilme.com.br or any of its subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Next.js fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # The apex answers 200 in whichever language the reader asked for
        # (proxy.ts rewrites "/" onto /en, or redirects to /pt-br | /es), so a
        # cache must key on what drove that choice. Next.js replaces Vary on
        # its prerendered responses, so it is set here, at the real cache
        # boundary.
        add_header Vary "Accept-Language, Cookie" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
