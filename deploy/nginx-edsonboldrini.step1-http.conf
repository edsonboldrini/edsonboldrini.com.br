# STEP 1 — HTTP only. Installed *before* certbot runs.
#
# Why this exists: an nginx block with `listen 443 ssl` but no ssl_certificate
# fails `nginx -t`. So the first config that touches the host is HTTP-only.
# It also has to exist before certbot, because the CorteFilme "sistema" block
# is `listen 80 default_server` with the catch-all `server_name _`, which
# 301-redirects unknown hosts to sistema.cortefilme.com.br — an ACME HTTP-01
# challenge would follow that redirect and fail. An explicit server_name here
# wins over the catch-all, so the challenge is answered locally.
#
# No `default_server` anywhere: that would duplicate the directive and steal
# the catch-all from CorteFilme.

server {
    listen 80;
    listen [::]:80;
    server_name edsonboldrini.com.br www.edsonboldrini.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
